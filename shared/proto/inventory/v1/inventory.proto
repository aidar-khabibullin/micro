syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aidar/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // ListParts возвращает список деталей с опциональной фильтрацией по типу
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Тип детали
enum PartType {
  PART_TYPE_UNSPECIFIED = 0;
  PART_TYPE_HULL = 1;
  PART_TYPE_ENGINE = 2;
  PART_TYPE_SHIELD = 3;
  PART_TYPE_WEAPON = 4;
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;

  // Название детали
  string name = 2;

  // Описание детали
  string description = 3;

  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;

  // Тип детали
  PartType part_type = 5;

  // Количество на складе
  int64 stock_quantity = 6;

  // Дата создания записи о детали
  google.protobuf.Timestamp created_at = 7;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  string uuid = 1;
}

// Ответ с деталью
message GetPartResponse {
  Part part = 1;
}

// Запрос на получение списка деталей.
// Если указаны uuids — возвращаются детали с этими UUID (в порядке запроса),
// иначе — применяется фильтрация по part_type (PART_TYPE_UNSPECIFIED = без фильтра).
message ListPartsRequest {
  repeated string uuids = 1;
  PartType part_type = 2;
}

// Ответ со списком деталей
message ListPartsResponse {
  repeated Part parts = 1;
}
